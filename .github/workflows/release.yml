# On every push to main (typically a squash from a version branch), build the
# plugin and publish a GitHub Release. Obsidian Community Plugins install from
# the release whose tag equals manifest.json "version" (x.y.z, no "v" / "Version_" prefix).
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version manifest.json)
          PKG=$(jq -r .version package.json)
          if [[ "$VERSION" != "$PKG" ]]; then
            echo "::error::manifest.json version ($VERSION) != package.json ($PKG)"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be semver x.y.z (Obsidian release tag), got: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.check.outputs.exists == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: Create tag and GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(git log -1 --pretty=%B)"
          gh release create "${VERSION}" \
            main.js \
            manifest.json \
            styles.css \
            --target "${{ github.sha }}" \
            --title "Export Img ${VERSION}" \
            --notes "${NOTES}"
